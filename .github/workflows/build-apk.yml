name: Construire l'APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install

      - name: Créer le projet Android
        run: npx cap add android

      - name: Icône et écran de démarrage
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#0d6b4f' --iconBackgroundColorDark '#0d6b4f' --splashBackgroundColor '#0d6b4f' --splashBackgroundColorDark '#0d6b4f'

      - name: Réglages Android (scanner, version)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="barcode_ui" />\n    </application>#' "$M"
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          npx cap sync android

      - name: Compiler
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Signer l'APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > ks.jks
          else
            echo "::warning::Pas de clé de signature dans les secrets : APK de test, les mises à jour devront être désinstallées avant."
            KEYSTORE_PASSWORD=test123456; KEY_PASSWORD=test123456; KEY_ALIAS=test
            keytool -genkeypair -keystore ks.jks -storepass $KEYSTORE_PASSWORD -keypass $KEY_PASSWORD -alias $KEY_ALIAS -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Test"
          fi
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks ks.jks --ks-pass pass:"$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass pass:"$KEY_PASSWORD" --out Traore-Caisse-Scanner.apk aligned.apk
          rm -f ks.jks

      - uses: actions/upload-artifact@v4
        with:
          name: Traore-Caisse-Scanner
          path: Traore-Caisse-Scanner.apk

      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Traoré Caisse Scanner 1.0.${{ github.run_number }}
          files: Traore-Caisse-Scanner.apk
